[package]
name = "taskstead"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A small task dashboard for persistent coding sessions in Ghostty"
license = "MIT"
repository = "https://github.com/chrstnjsff/taskstead"
homepage = "https://github.com/chrstnjsff/taskstead"
readme = "README.md"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive", "env"] }
crossterm = "0.29"
ratatui = "0.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.27"
uuid = { version = "1.23", features = ["v4"] }

[profile.release]
lto = "thin"
strip = true
